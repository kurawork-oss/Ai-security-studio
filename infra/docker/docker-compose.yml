# Local full-stack (Postgres + migrations + API). Web runs separately (npm run dev).
#   docker compose -f infra/docker/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: secureai
      POSTGRES_PASSWORD: secureai
      POSTGRES_DB: secureai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureai"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply local shim + migrations + seed, then exit.
  migrate:
    image: postgres:16
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: secureai
    volumes: ["../supabase:/sql:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "psql -h db -U secureai -d secureai -v ON_ERROR_STOP=1 -f /sql/local/00_local_shim.sql &&
       psql -h db -U secureai -d secureai -v ON_ERROR_STOP=1 -f /sql/migrations/0001_init.sql &&
       psql -h db -U secureai -d secureai -v ON_ERROR_STOP=1 -f /sql/migrations/0002_rls.sql &&
       psql -h db -U secureai -d secureai -v ON_ERROR_STOP=1 -f /sql/seed.sql"

  api:
    build:
      context: ../../apps/api
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      SECUREAI_DATABASE_URL: postgresql+asyncpg://secureai:secureai@db:5432/secureai
      SECUREAI_SUPABASE_JWT_SECRET: dev-secret
      SECUREAI_ENCRYPTION_KEK: dev-only-change-me-0123456789abcdef0123456789abcdef
      SECUREAI_CORS_ORIGINS: http://localhost:3000
      SECUREAI_ENVIRONMENT: development
      SECUREAI_DEV_SEED: "false"
      PORT: "8080"
    ports: ["8000:8080"]

volumes:
  pgdata: {}
